name: build-push

# see below why there is no workflow concurrency
on: # jactionlint ignore=concurrency-limits
  push:
    # other branches are built by their pull request
    branches:
      - main
      - maint/**
  merge_group:

# no workflow concurrency: it would also cancel a release that already started,
# the `cancel-older` job cancels the older runs of a branch instead

permissions:
  contents: read

env:
  DRY_RUN: ${{ github.ref_name != github.event.repository.default_branch && !startsWith(github.ref_name, 'maint/') }}
  OWNER: ${{ github.repository_owner }}
  FILE: base
  BUILDKIT_PROGRESS: plain
  BUILDX_NO_DEFAULT_LOAD: 1
  CONTAINERBASE_VERSION: 0.0.0-PLACEHOLDER+${{ github.sha }}
  APT_HTTP_PROXY: http://host.docker.internal:8000

jobs:
  # semantic-release refuses to release a commit that isn't the branch head, so
  # the newest push cancels the older runs of its branch whose release can't
  # have started yet; a release that is already running is never interrupted
  cancel-older:
    if: github.event_name == 'push'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel older runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          runs=$(gh run list --workflow build-push.yml --branch "${BRANCH}" --event push \
            --json databaseId,status \
            --jq ".[] | select(.status != \"completed\" and .databaseId < ${RUN_ID}) | .databaseId")
          for id in ${runs}; do
            # the release needs the whole build, so it can only have started once
            # `test-success` completed; the release takes minutes before it
            # publishes anything, so cancelling right before that is harmless
            done_jobs=$(gh run view "${id}" --json jobs \
              --jq '.jobs[] | select(.name == "build / test-success" and .status == "completed") | .name')
            if [[ -n "${done_jobs}" ]]; then
              echo "Keeping run ${id}, its release may have started"
              continue
            fi
            echo "Cancelling older run ${id}"
            gh run cancel "${id}" || echo "Run ${id} already finished"
          done

  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      checks: write
      id-token: write
      security-events: write

  release:
    needs: [build]
    # release only from pushes to `main` and `maint/**`, the merge queue only builds
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      # never cancel a release that has already started, as it may have started pushing artifacts
      cancel-in-progress: false

    permissions:
      contents: write
      packages: write
      id-token: write
      # semantic-release comments on the released issues and pull requests
      issues: write
      pull-requests: write

    steps:
      # full checkout for semantic-release, which pushes the release tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked]
          fetch-depth: 0
          show-progress: false
          filter: blob:none # we don't need all blobs

      - name: Check system
        uses: ./.github/actions/check

      # allow build cross arch images
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: init
        run: |
          echo "OWNER=${OWNER,,}" >> "${GITHUB_ENV}"
          echo "CACHE_WEEK=$(date +%U)" >> "${GITHUB_ENV}"

      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@c0edd0d701889647e47d726641bcba2a6d92eabe # v5.3.6
        with:
          checkout: false
          apt-proxy: true

      - name: Docker registry login
        if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'maint/')
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: semantic-release
        run: pnpm semantic-release --dry-run "${DRY_RUN}" --ci "${CI_MODE}"
        env:
          CI_MODE: ${{ env.DRY_RUN != 'true' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: semantic-release:github
