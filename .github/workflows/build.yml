name: build

on:
  workflow_call:

env:
  OWNER: ${{ github.repository_owner }}
  FILE: base
  BUILDKIT_PROGRESS: plain
  BUILDX_NO_DEFAULT_LOAD: 1
  CONTAINERBASE_VERSION: 0.0.0-PLACEHOLDER+${{ github.sha }}
  APT_HTTP_PROXY: http://host.docker.internal:8000
  HUSKY: 0

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-slim
    timeout-minutes: 15

    outputs:
      uid: ${{ steps.init.outputs.uid }}
      skip-build: ${{ steps.changes.outputs.skip-build }}
      lang-matrix: ${{ steps.matrix.outputs.lang-matrix }}
      run-lang: ${{ steps.matrix.outputs.run-lang }}
      run-distro: ${{ steps.matrix.outputs.run-distro }}
      run-base-arm64: ${{ steps.matrix.outputs.run-base-arm64 }}

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@796ee0d220d828ac43560c5d3df409f6a29f8bf0 # v5.3.10
        with:
          save-cache: true

      - name: ⚙️ Init
        id: init
        run: echo "uid=$(uuidgen)" >> "${GITHUB_OUTPUT}"

      # pull requests and merge queue groups which only change files that feed
      # neither the images nor the bats tests skip the build and docker tests:
      # docs, the dev container (it has its own workflow), editor and repo
      # settings, and lint and vitest configs (those jobs still run); pushes
      # always run everything, as they release
      - name: ⚙️ Check for changes that don't need the build
        id: changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          git diff --no-renames --name-only "${BASE_SHA}" HEAD > "${RUNNER_TEMP}/changed-files"
          if grep -vE \
            -e '\.md$' \
            -e '^docs/' \
            -e '^\.devcontainer/' \
            -e '^\.github/workflows/devcontainer\.yml$' \
            -e '^\.github/renovate\.json$' \
            -e '^\.github/ISSUE_TEMPLATE/' \
            -e '^\.vscode/' \
            -e '^\.editorconfig$' \
            -e '^\.husky/' \
            -e '^\.lintstagedrc\.json$' \
            -e '^\.gitignore$' \
            -e '^LICENSE$' \
            -e '^\.oxlintrc\.json$' \
            -e '^\.prettierrc\.json$' \
            -e '^\.prettierignore$' \
            -e '^\.markdownlint-cli2\.jsonc$' \
            -e '^\.github/zizmor\.yml$' \
            -e '^tools/(audit-sarif|lint-docs|lint-versions)\.ts$' \
            -e '^\.github/workflows/(pnpm-audit|trivy)\.yml$' \
            -e '^vitest\.config\.ts$' \
            -e '^__mocks__/' \
            -e '^codecov\.yml$' \
            "${RUNNER_TEMP}/changed-files"; then
            echo "skip-build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "skip-build=true" >> "${GITHUB_OUTPUT}"
          fi

      # the `lang` matrix has an entry for each `test/<lang>/Dockerfile`
      # (x86_64) and `test/<lang>/Dockerfile.arm64` (aarch64). Pull requests
      # and merge queue groups which only change test Dockerfiles, like most
      # `test(deps)` updates, only run the docker tests of those files; any
      # other change runs all of them
      - name: ⚙️ Compute docker test matrix
        id: matrix
        run: |
          changed="${RUNNER_TEMP}/changed-files"
          docker_only=false
          if [[ -s "${changed}" ]] && ! grep -qvE '^test/([^/]+/Dockerfile(\.arm64)?|Dockerfile\.(base|distro))$' "${changed}"; then
            docker_only=true
          fi

          # whether a test Dockerfile is part of this run
          function selected () {
            [[ "${docker_only}" != "true" ]] || grep -qxF "${1}" "${changed}"
          }

          x86_64='{"name":"x86_64","os":"ubuntu-26.04","tag":"amd64"}'
          aarch64='{"name":"aarch64","os":"ubuntu-26.04-arm","tag":"arm64"}'
          entries=()
          for dir in test/*/; do
            lang=$(basename "${dir}")
            # used by the `base` job
            if [[ "${lang}" == "readonly" ]]; then
              continue
            fi
            if [[ -f "${dir}Dockerfile" ]] && selected "${dir}Dockerfile"; then
              entries+=("{\"lang\":\"${lang}\",\"arch\":${x86_64}}")
            fi
            if [[ -f "${dir}Dockerfile.arm64" ]] && selected "${dir}Dockerfile.arm64"; then
              entries+=("{\"lang\":\"${lang}\",\"arch\":${aarch64}}")
            fi
          done

          run_lang=false
          if [[ ${#entries[@]} -gt 0 ]]; then
            run_lang=true
          fi
          run_distro=false
          if selected test/Dockerfile.distro; then
            run_distro=true
          fi
          run_base_arm64=false
          if selected test/Dockerfile.base; then
            run_base_arm64=true
          fi

          matrix="{\"include\":[$(IFS=,; echo "${entries[*]}")]}"
          echo "docker only: ${docker_only}, distro: ${run_distro}, base-arm64: ${run_base_arm64}"
          echo "lang matrix: ${matrix}"
          {
            echo "lang-matrix=${matrix}"
            echo "run-lang=${run_lang}"
            echo "run-distro=${run_distro}"
            echo "run-base-arm64=${run_base_arm64}"
          } >> "${GITHUB_OUTPUT}"

  lint:
    runs-on: ubuntu-26.04
    needs: setup
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    env:
      # node and pnpm come from the setup action, so `mise exec` must not
      # install them again
      MISE_EXEC_AUTO_INSTALL: 'false'

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@796ee0d220d828ac43560c5d3df409f6a29f8bf0 # v5.3.10

      - name: lint
        run: |
          pnpm oxlint --format github
          pnpm prettier
          pnpm lint:docs
          pnpm lint:markdown
          pnpm lint:types
          pnpm lint:schema
          pnpm lint:tools
          pnpm lint:versions

      - name: shellcheck
        if: ${{ github.event_name != 'merge_group' }}
        uses: reviewdog/action-shellcheck@d0b8d5fd7fad6afdb6e1b6ce1778892be4d1f427 # v1.34.1
        with:
          fail_level: any
          reporter: github-pr-annotations
          filter_mode: nofilter
          path: |
            src
            .husky
          pattern: |
            *.sh
            *.bats
          check_all_files_with_shebangs: 'true'

      - name: Install the workflow linters
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: jactionlint shellcheck zizmor

      # the full checkout includes the local composite actions, so jactionlint
      # validates their metadata and zizmor audits them
      - name: Check workflow files
        run: mise exec -- jactionlint --color --ignore 'invalid activity type "destroyed" for "merge_group" Webhook event. available types are "checks_requested"'

      - name: Run zizmor
        run: mise exec -- zizmor --format github .github/
        env:
          GH_TOKEN: ${{ github.token }}

  bats:
    runs-on: ubuntu-26.04
    needs: setup
    # skipped for docs or dev container only pull requests, like the build
    if: needs.setup.outputs.skip-build != 'true'
    timeout-minutes: 15

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@796ee0d220d828ac43560c5d3df409f6a29f8bf0 # v5.3.10

      - name: Install ubuntu dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y libarchive-tools

      - name: build
        run: pnpm build

      - name: bats
        run: pnpm test:bats

  vitest:
    runs-on: ubuntu-26.04
    needs: setup
    timeout-minutes: 15
    permissions:
      id-token: write

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@796ee0d220d828ac43560c5d3df409f6a29f8bf0 # v5.3.10

      # the schema tests validate the embedded tool-versions data, so a
      # breaking change of its format fails here
      - name: download tool-versions
        run: pnpm tool-versions

      - name: vitest
        run: pnpm test:vitest

      - name: Codecov test results
        if: github.event_name != 'merge_group' && !cancelled()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          report_type: test_results

      - name: Codecov coverage results
        if: github.event_name != 'merge_group'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true

  build:
    runs-on: ubuntu-26.04
    needs: setup
    # skipped for docs or dev container only pull requests, so `base`,
    # `distro`, `base-arm64` and `lang` are skipped too
    if: needs.setup.outputs.skip-build != 'true'
    timeout-minutes: 15

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@796ee0d220d828ac43560c5d3df409f6a29f8bf0 # v5.3.10

      - name: build
        run: pnpm build

      - name: upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/

  base:
    runs-on: ${{ matrix.arch.os }}
    name: base (${{ matrix.arch.name }})
    needs:
      - setup
      - build
    # one bake with up to 2 attempts of 10 minutes (21 minutes with the retry
    # wait), plus the setup and the other steps
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86_64
            os: ubuntu-26.04
            tag: amd64
          - name: aarch64
            os: ubuntu-26.04-arm
            tag: arm64

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@796ee0d220d828ac43560c5d3df409f6a29f8bf0 # v5.3.10
        # fails fast when preparing the apt proxy hangs
        timeout-minutes: 10
        with:
          node: false
          apt-proxy: true

      - name: Check system
        # the setup action checks out the repository
        uses: ./.github/actions/check # jactionlint ignore=local-action-checkout

      - name: ⚙️ Init
        run: |
          echo "OWNER=${OWNER,,}" >> "${GITHUB_ENV}"

      - name: build base
        uses: ./.github/actions/bake
        with:
          args: >-
            --set build-docker.cache-to=type=gha,mode=max,scope=${{ needs.setup.outputs.uid }}-${{ matrix.arch.tag }}
            --set settings.cache-from+=type=gha,scope=${{ needs.setup.outputs.uid }}-${{ matrix.arch.tag }}
            build-docker

      - name: test read-only file system
        run: test/readonly/test.sh

  distro:
    runs-on: ubuntu-26.04
    # docker tests are skipped for draft pull requests, and when only other
    # test Dockerfiles changed
    if: github.event.pull_request.draft != true && needs.setup.outputs.run-distro == 'true'
    needs:
      - setup
      - bats
      - lint
      - vitest
      - build
    # one bake with its retry, like `base`
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        distro:
          - jammy
          - noble
          - resolute

    env:
      TAG: ${{ matrix.distro }}

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@796ee0d220d828ac43560c5d3df409f6a29f8bf0 # v5.3.10
        # fails fast when preparing the apt proxy hangs
        timeout-minutes: 10
        with:
          node: false
          apt-proxy: true

      - name: Check system
        # the setup action checks out the repository
        uses: ./.github/actions/check # jactionlint ignore=local-action-checkout

      - name: ⚙️ Download proxy
        uses: ./.github/actions/download-proxy

      - name: ⚙️  Init
        run: |
          echo "OWNER=${OWNER,,}" >> "${GITHUB_ENV}"

      - name: test distro
        uses: ./.github/actions/bake
        with:
          args: test-distro

      - name: Download proxy errors
        if: failure()
        run: .github/actions/download-proxy/errors.sh

      - name: Download proxy cache stats
        if: always()
        run: .github/actions/download-proxy/stats.sh

  # test old distros on arm64
  base-arm64:
    runs-on: ubuntu-26.04-arm
    if: github.event.pull_request.draft != true && needs.setup.outputs.run-base-arm64 == 'true'
    needs:
      - setup
      - bats
      - lint
      - vitest
      - build
    # one bake with its retry, like `base`
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        distro:
          - jammy
          - resolute

    env:
      TAG: ${{ matrix.distro }}

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@796ee0d220d828ac43560c5d3df409f6a29f8bf0 # v5.3.10
        # fails fast when preparing the apt proxy hangs
        timeout-minutes: 10
        with:
          node: false
          apt-proxy: true

      - name: Check system
        # the setup action checks out the repository
        uses: ./.github/actions/check # jactionlint ignore=local-action-checkout

      - name: ⚙️  Init
        run: |
          echo "OWNER=${OWNER,,}" >> "${GITHUB_ENV}"

      - name: test distro
        uses: ./.github/actions/bake
        with:
          args: test-base

  lang:
    runs-on: ${{ matrix.arch.os }}
    name: ${{ matrix.lang }} (${{ matrix.arch.name }})
    if: github.event.pull_request.draft != true && needs.setup.outputs.run-lang == 'true'
    needs:
      - setup
      - base
      - bats
      - lint
      - vitest
    # two bakes (base from the cache, then the tests) with their retry, 42
    # minutes at most, plus the setup and the other steps
    timeout-minutes: 60

    strategy:
      max-parallel: 10
      fail-fast: false
      # computed by `setup` from the test Dockerfiles, a test without
      # `Dockerfile.arm64` only runs on x86_64
      matrix: ${{ fromJSON(needs.setup.outputs.lang-matrix) }}

    env:
      TAG: ${{ matrix.lang }}

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@796ee0d220d828ac43560c5d3df409f6a29f8bf0 # v5.3.10
        # fails fast when preparing the apt proxy hangs
        timeout-minutes: 10
        with:
          node: false
          apt-proxy: true

      - name: Check system
        # the setup action checks out the repository
        uses: ./.github/actions/check # jactionlint ignore=local-action-checkout

      - name: ⚙️ Init
        run: |
          echo "OWNER=${OWNER,,}" >> "${GITHUB_ENV}"
          echo "BASE_IMAGE=containerbase/test" >> "${GITHUB_ENV}"

      - name: build base
        # rebuilds the base image from the GHA cache the `base` job filled,
        # loading it into the local image store as `containerbase/test` for
        # the test build below
        uses: ./.github/actions/bake
        with:
          args: >-
            --set settings.cache-from+=type=gha,scope=${{ needs.setup.outputs.uid }}-${{ matrix.arch.tag }}
            build-docker

      # only after the base image, so it builds with the same args as in the
      # `base` job and is taken from the GHA cache
      - name: ⚙️ Download proxy
        uses: ./.github/actions/download-proxy

      - name: test distro
        uses: ./.github/actions/bake
        with:
          args: test-${{ matrix.arch.name }}

      - name: Download proxy errors
        if: failure()
        run: .github/actions/download-proxy/errors.sh

      - name: Download proxy cache stats
        if: always()
        run: .github/actions/download-proxy/stats.sh

  # Catch-all required check for the test matrix, `base` is listed too because
  # `lang` is skipped when it fails
  test-success:
    needs:
      - base
      - base-arm64
      - distro
      - lang
    runs-on: ubuntu-slim
    timeout-minutes: 1
    if: always()
    steps:
      - name: Fail for failed or cancelled tests
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
