name: build

on:
  workflow_call:

env:
  OWNER: ${{ github.repository_owner }}
  FILE: base
  BUILDKIT_PROGRESS: plain
  BUILDX_NO_DEFAULT_LOAD: 1
  CONTAINERBASE_VERSION: ${{ github.sha }}
  APT_HTTP_PROXY: http://host.docker.internal:8000
  HUSKY: 0

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-slim
    timeout-minutes: 15

    outputs:
      uid: ${{ steps.init.outputs.uid }}
      docs-only: ${{ steps.docs.outputs.docs-only }}

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@d7fbd383dbf6cddf7e6bb2d787342a7f1cb92620 # v5.0.54
        with:
          save-cache: true

      - name: ⚙️ Init
        id: init
        run: echo "uid=$(uuidgen)" >> "${GITHUB_OUTPUT}"

      # pull requests which only change docs skip the build and docker tests,
      # pushes and the merge queue always run everything
      - name: ⚙️ Check for docs-only changes
        id: docs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          git diff --no-renames --name-only "${BASE_SHA}" HEAD > "${RUNNER_TEMP}/changed-files"
          if grep -vE '(\.md$|^docs/)' "${RUNNER_TEMP}/changed-files"; then
            echo "docs-only=false" >> "${GITHUB_OUTPUT}"
          else
            echo "docs-only=true" >> "${GITHUB_OUTPUT}"
          fi

  lint:
    runs-on: ubuntu-24.04
    needs: setup
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@d7fbd383dbf6cddf7e6bb2d787342a7f1cb92620 # v5.0.54

      - name: lint
        run: |
          pnpm oxlint --format github
          pnpm prettier
          pnpm lint:docs
          pnpm lint:markdown
          pnpm lint:types
          pnpm lint:schema
          pnpm lint:tools
          pnpm lint:versions

      - name: shellcheck
        if: ${{ github.event_name != 'merge_group' }}
        uses: reviewdog/action-shellcheck@d0b8d5fd7fad6afdb6e1b6ce1778892be4d1f427 # v1.34.1
        with:
          fail_level: any
          reporter: github-pr-annotations
          filter_mode: nofilter
          path: |
            src
            .husky
          pattern: |
            *.sh
            *.bats
          check_all_files_with_shebangs: 'true'

  lint-actions:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          # include the local composite actions, so that actionlint validates
          # their metadata, and zizmor audits them
          sparse-checkout: .github/

      - name: Check workflow files
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color -ignore "invalid activity type \"destroyed\" for \"merge_group\" Webhook event. available types are \"checks_requested\""

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1

  bats:
    runs-on: ubuntu-24.04
    needs: setup
    # skipped for docs-only pull requests, like the jobs depending on it
    if: needs.setup.outputs.docs-only != 'true'
    timeout-minutes: 15

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@d7fbd383dbf6cddf7e6bb2d787342a7f1cb92620 # v5.0.54

      - name: Install ubuntu dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y libarchive-tools

      - name: build
        run: pnpm build

      - name: bats
        run: pnpm test:bats

  vitest:
    runs-on: ubuntu-24.04
    needs: setup
    timeout-minutes: 15
    permissions:
      id-token: write

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@d7fbd383dbf6cddf7e6bb2d787342a7f1cb92620 # v5.0.54

      - name: vitest
        run: pnpm test:vitest

      - name: Codecov test results
        if: github.event_name != 'merge_group' && !cancelled()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          report_type: test_results

      - name: Codecov coverage results
        if: github.event_name != 'merge_group'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true

  build:
    runs-on: ubuntu-24.04
    needs: setup
    # skipped for docs-only pull requests, so `base`, `distro`, `base-arm64`
    # and `lang` are skipped too
    if: needs.setup.outputs.docs-only != 'true'
    timeout-minutes: 15

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@d7fbd383dbf6cddf7e6bb2d787342a7f1cb92620 # v5.0.54

      - name: build
        run: pnpm build

      - name: upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/

  base:
    runs-on: ${{ matrix.arch.os }}
    name: base (${{ matrix.arch.name }})
    needs:
      - setup
      - build

    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86_64
            os: ubuntu-24.04
            tag: amd64
          - name: aarch64
            os: ubuntu-24.04-arm
            tag: arm64

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@d7fbd383dbf6cddf7e6bb2d787342a7f1cb92620 # v5.0.54
        with:
          node: false
          apt-proxy: true

      - name: Check system
        uses: ./.github/actions/check

      - name: ⚙️ Init
        run: |
          echo "OWNER=${OWNER,,}" >> "${GITHUB_ENV}"

      - name: build base
        uses: ./.github/actions/bake
        with:
          args: >-
            --set build-docker.cache-to=type=gha,mode=max,scope=${{ needs.setup.outputs.uid }}-${{ matrix.arch.tag }}
            --set settings.cache-from+=type=gha,scope=${{ needs.setup.outputs.uid }}-${{ matrix.arch.tag }}
            build-docker

      - name: test read-only file system
        run: test/readonly/test.sh

  distro:
    runs-on: ubuntu-24.04
    # docker tests are skipped for draft pull requests
    if: github.event.pull_request.draft != true
    needs:
      - bats
      - lint
      - vitest
      - build

    strategy:
      fail-fast: false
      matrix:
        distro:
          - jammy
          - noble
          - resolute

    env:
      TAG: ${{ matrix.distro }}

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@d7fbd383dbf6cddf7e6bb2d787342a7f1cb92620 # v5.0.54
        with:
          node: false
          apt-proxy: true

      - name: Check system
        uses: ./.github/actions/check

      - name: ⚙️ Download proxy
        uses: ./.github/actions/download-proxy

      - name: ⚙️  Init
        run: |
          echo "OWNER=${OWNER,,}" >> "${GITHUB_ENV}"

      - name: test distro
        uses: ./.github/actions/bake
        with:
          args: test-distro

      - name: Download proxy errors
        if: failure()
        run: .github/actions/download-proxy/errors.sh

  # test old distros on arm64
  base-arm64:
    runs-on: ubuntu-24.04-arm
    if: github.event.pull_request.draft != true
    needs:
      - bats
      - lint
      - vitest
      - build
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        distro:
          - jammy
          - resolute

    env:
      TAG: ${{ matrix.distro }}

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@d7fbd383dbf6cddf7e6bb2d787342a7f1cb92620 # v5.0.54
        with:
          node: false
          apt-proxy: true

      - name: Check system
        uses: ./.github/actions/check

      - name: ⚙️ Download proxy
        uses: ./.github/actions/download-proxy

      - name: ⚙️  Init
        run: |
          echo "OWNER=${OWNER,,}" >> "${GITHUB_ENV}"

      - name: test distro
        uses: ./.github/actions/bake
        with:
          args: test-base

      - name: Download proxy errors
        if: failure()
        run: .github/actions/download-proxy/errors.sh

  lang:
    runs-on: ${{ matrix.arch.os }}
    name: ${{ matrix.lang }} (${{ matrix.arch.name }})
    if: github.event.pull_request.draft != true
    needs:
      - setup
      - base
      - bats
      - lint
      - vitest

    strategy:
      max-parallel: 10
      fail-fast: false
      matrix:
        lang:
          - dart
          - dotnet
          - erlang
          - flutter
          - flux
          - golang
          - haskell
          - java
          - jb
          - helm
          - nix
          - node
          - php
          - powershell
          - python
          - ruby
          - rust
          - swift
          - latest
        arch:
          - name: x86_64
            os: ubuntu-24.04
            tag: amd64
          - name: aarch64
            os: ubuntu-24.04-arm
            tag: arm64
        # include:
        #   # no ubuntu arm64 support for haskell
        #   - lang: haskell
        #     arch:
        #       name: x86_64
        #       os: ubuntu-24.04
        #       tag: amd64

    env:
      TAG: ${{ matrix.lang }}

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@d7fbd383dbf6cddf7e6bb2d787342a7f1cb92620 # v5.0.54
        with:
          node: false
          apt-proxy: true

      - name: Check system
        uses: ./.github/actions/check

      - name: ⚙️ Init
        run: |
          echo "OWNER=${OWNER,,}" >> "${GITHUB_ENV}"
          echo "BASE_IMAGE=containerbase/test" >> "${GITHUB_ENV}"

      - name: build base
        # rebuilds the base image from the GHA cache the `base` job filled,
        # loading it into the local image store as `containerbase/test` for
        # the test build below
        uses: ./.github/actions/bake
        with:
          args: >-
            --set settings.cache-from+=type=gha,scope=${{ needs.setup.outputs.uid }}-${{ matrix.arch.tag }}
            build-docker

      # only after the base image, so it builds with the same args as in the
      # `base` job and is taken from the GHA cache
      - name: ⚙️ Download proxy
        uses: ./.github/actions/download-proxy

      - name: test distro
        uses: ./.github/actions/bake
        with:
          args: test-${{ matrix.arch.name }}

      - name: Download proxy errors
        if: failure()
        run: .github/actions/download-proxy/errors.sh

  # Catch-all required check for the test matrix, `base` is listed too because
  # `lang` is skipped when it fails
  test-success:
    needs:
      - base
      - base-arm64
      - distro
      - lang
    runs-on: ubuntu-slim
    timeout-minutes: 1
    if: always()
    steps:
      - name: Fail for failed or cancelled tests
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
