name: auto-pr

# every event does its own work (reviewers, one backport per label), so runs must
# not cancel or replace each other
on: # jactionlint ignore=concurrency-limits
  # needed to assign reviewers and backport fork pull requests, no job checks
  # out or runs code from the pull request
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - closed
      - labeled

permissions: {}

jobs:
  debug:
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: event info
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
        run: printf '%s\n' "${GITHUB_CONTEXT}"

  review:
    if: github.event.action == 'opened' && !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: hkusu/review-assign-action@5bee595fdb9765d4a0bd35724b6302fa15569158 # v1.4.0
        with:
          reviewers: ${{ vars.REVIEWERS }}
          max-num-of-reviewers: 2

  backport:
    if: >
      github.event.pull_request.merged
      && (
        (
          github.event.action == 'closed'
          && contains(github.event.pull_request.labels.*.name, 'backport:')
        )
        || (
          github.event.action == 'labeled'
          && startsWith(github.event.label.name, 'backport:')
        )
      )
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: kiegroup/git-backporting@b69251c55a7fba1a44ccbc9494c4c38ba95567e8 # v5.0.0
        with:
          target-branch-pattern: '^backport:(?<target>(.*))$'
          strategy: ort
          strategy-option: find-renames
          cherry-pick-options: -x
          auth: ${{ secrets.GITHUB_TOKEN }}
          pull-request: ${{ github.event.pull_request.url }}
          auto-no-squash: true
          enable-err-notification: true
