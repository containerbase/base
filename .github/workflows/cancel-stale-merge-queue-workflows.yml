name: Cancel stale merge queue workflows
# each run handles its own destroyed merge group, so runs must not cancel each other
on: # jactionlint ignore=concurrency-limits
  merge_group:
    types:
      - destroyed

permissions: {}

jobs:
  cancel-workflows:
    name: Cancel Workflow Runs

    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write

    # a merged group finishes its runs, the others are outdated
    if: github.event.reason != 'merged'

    steps:
      - name: Cancel Workflow Runs by SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          REASON: ${{ github.event.reason }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Merge group ${HEAD_SHA} destroyed: ${REASON}"
          runs=$(gh run list --commit "${HEAD_SHA}" --json databaseId,status \
            --jq ".[] | select(.status != \"completed\" and .databaseId != ${RUN_ID}) | .databaseId")
          for id in ${runs}; do
            echo "Cancelling workflow run ${id}"
            gh run cancel "${id}" || echo "Run ${id} already finished"
          done
