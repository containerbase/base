name: build-pr

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      # runs the docker tests skipped for drafts
      - ready_for_review
      # cancels a running full test run
      - converted_to_draft

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      checks: write
      id-token: write
      security-events: write
