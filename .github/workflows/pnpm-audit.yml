name: pnpm-audit

# reports the advisories of the root lockfile to code scanning, because the
# dependency graph doesn't read pnpm's two-document lockfile yet
# https://github.com/dependabot/dependabot-core/issues/15904

on:
  schedule:
    - cron: '29 11 * * *'
  push:
    branches:
      - main
    paths:
      - pnpm-lock.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  pnpm-audit:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@59f82735f639df5ecc8febc4ae9d10ed8ea03c7a # v5.3.15

      # `pnpm audit` exits non zero when it finds advisories, the converter
      # fails instead when the report is missing
      - name: pnpm audit
        run: pnpm audit --json > "${RUNNER_TEMP}/pnpm-audit.json" || true

      - name: Convert to SARIF
        run: node tools/audit-sarif.ts "${RUNNER_TEMP}/pnpm-audit.json" pnpm-audit.sarif

      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: pnpm-audit.sarif
          category: pnpm-audit
