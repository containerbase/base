name: pnpm-audit

# reports the advisories of the root lockfile to code scanning, because the
# dependency graph doesn't read pnpm's two-document lockfile yet
# https://github.com/dependabot/dependabot-core/issues/15904

on:
  schedule:
    - cron: '29 11 * * *'
  push:
    branches:
      - main
    paths:
      - pnpm-lock.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  pnpm-audit:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@c550d0fcc136e1558a3531f7f5348cca37304913 # v5.4.19

      # `pnpm audit` exits non zero when it finds advisories, the converter
      # fails instead when the report is missing
      - name: pnpm audit
        run: pnpm audit --json > "${RUNNER_TEMP}/pnpm-audit.json" || true

      - name: Convert to SARIF
        run: node tools/audit-sarif.ts "${RUNNER_TEMP}/pnpm-audit.json" pnpm-audit.sarif

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: pnpm-audit.sarif
          category: pnpm-audit
