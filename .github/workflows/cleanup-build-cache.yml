name: cleanup-build-cache

# deletes the handoff caches the `base` jobs of `build.yml` push to
# ghcr.io/<owner>/docker-build-cache, tagged `<uuid>-<arch>`. They are only
# read by the `lang` jobs of the same run, so a day is plenty. Other tags in
# the package are never touched.
# Also deletes old untagged versions: caches whose tag was overwritten by a
# newer push, nothing reads them anymore.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only list the versions to delete'
        type: boolean
        default: false

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      # needs the admin role for this repository in the package settings
      packages: write

    steps:
      - name: Delete old handoff caches
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: ${{ github.repository_owner }}
          PACKAGE: docker-build-cache
          DRY_RUN: ${{ inputs.dry-run || 'false' }}
          # in hours, for the handoff tags
          MAX_AGE: 24
          # in days, for untagged versions
          MAX_UNTAGGED_AGE: 7
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "-${MAX_AGE} hours" +%Y-%m-%dT%H:%M:%SZ)"
          untagged_cutoff="$(date -u -d "-${MAX_UNTAGGED_AGE} days" +%Y-%m-%dT%H:%M:%SZ)"
          # handoff versions older than the cutoff, whose tags are all handoff
          # tags, and untagged versions older than the untagged cutoff
          gh api --paginate "/orgs/${ORG}/packages/container/${PACKAGE}/versions?per_page=100" \
            --jq '.[]
              | .metadata.container.tags as $tags
              | select(
                  (($tags | length) > 0
                    and .updated_at < "'"${cutoff}"'"
                    and all($tags[]; test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}-(amd64|arm64)$")))
                  or (($tags | length) == 0 and .updated_at < "'"${untagged_cutoff}"'")
                )
              | "\(.id) \(if ($tags | length) > 0 then ($tags | join(",")) else "<untagged>" end)"' \
            > versions.txt
          echo "$(wc -l < versions.txt) versions to delete (handoff tags before ${cutoff}, untagged before ${untagged_cutoff})"
          while read -r id tags; do
            echo "delete ${id} ${tags}"
            if [[ "${DRY_RUN}" != "true" ]]; then
              gh api -X DELETE "/orgs/${ORG}/packages/container/${PACKAGE}/versions/${id}" || echo "::warning::failed to delete ${id} ${tags}"
            fi
          done < versions.txt
