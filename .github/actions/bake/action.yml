name: 'bake'
description: 'builds a containerbase image using Docker Buildx'
inputs:
  token:
    description: 'GitHub token'
    default: ${{ github.token }}
    required: true
  args:
    description: 'Arguments for Docker Buildx bake'
    default: ''

runs:
  using: 'composite'

  steps:
    - name: fetch dist
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist

    - name: fix executable
      shell: bash
      run: |
        chmod +x dist/cli/*
        chmod +x dist/docker/usr/local/containerbase/bin/*
        chmod +x dist/docker/usr/local/sbin/*

    - name: bake
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 10
        max_attempts: 3
        retry_wait_seconds: 60
        polling_interval_seconds: 5
        command: docker buildx bake --set settings.secrets=type=env,id=GITHUB_TOKEN ${{ inputs.args }}
        # an aborted build can leave a broken snapshot in the builder cache, which
        # fails every retry with "failed to commit ... snapshot ... not found"
        on_retry_command: docker buildx prune --force
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
