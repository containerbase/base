# Caching reverse proxy for CONTAINERBASE_CDN in the container tests.
# The CLI rewrites https://<host>/<path> to <cdn>/<host>/<path>, so this proxy
# maps the first path segment back to the upstream host and caches the result.
worker_processes auto;
error_log /var/log/containerbase-cdn/error.log warn;
pid /run/containerbase-cdn.pid;

events {
  worker_connections 1024;
}

http {
  # with the requested host, the host after redirects and the cache status,
  # which stats.sh sums up
  log_format cdn '$remote_addr [$time_local] "$request" $status $body_bytes_sent host=$upstream_host final=$final_host cache=$upstream_cache_status';
  access_log /var/log/containerbase-cdn/access.log cdn;

  # systemd-resolved stub of the runner
  resolver 127.0.0.53 ipv6=off valid=300s;

  # keep space for the docker builds on the runner disk
  proxy_cache_path /var/cache/containerbase-cdn levels=1:2 keys_zone=cdn:10m
    max_size=4g min_free=2g inactive=1d use_temp_path=off;

  # keep the connections to the package registries open: npm and gem installs
  # send thousands of small requests, and a new TLS connection for each made
  # them slower than without the proxy. `proxy_pass` with a host variable uses
  # an upstream group of the same name when there is one.
  upstream registry.npmjs.org {
    server registry.npmjs.org:443;
    keepalive 32;
  }

  upstream rubygems.org {
    server rubygems.org:443;
    keepalive 16;
  }

  upstream pypi.org {
    server pypi.org:443;
    keepalive 16;
  }

  upstream files.pythonhosted.org {
    server files.pythonhosted.org:443;
    keepalive 16;
  }

  # split the raw request uri, so encoded characters like `%2F` in a path
  # reach the upstream unchanged.
  # npm builds tarball urls with `new URL(pathname, registry)`, which drops the
  # `/registry.npmjs.org` prefix of the registry, so those paths arrive without
  # a host and are sent to the npm registry, with an optional query string.
  # Regexes are checked in order.
  map $request_uri $upstream_host {
    default '';
    ~^/(@[^/]+/)?[^/]+/-/[^/?]+\.tgz(\?.*)?$ registry.npmjs.org;
    ~^/(?<cdn_host>[^/?]+)/ $cdn_host;
  }

  map $request_uri $upstream_rest {
    default '';
    ~^/(?<npm_tarball>(@[^/]+/)?[^/]+/-/[^/?]+\.tgz(\?.*)?)$ $npm_tarball;
    ~^/[^/?]+/(?<cdn_rest>.*)$ $cdn_rest;
  }

  # only known download hosts, so this is no open proxy
  map $upstream_host $upstream_allowed {
    default 0;
    include /etc/containerbase-cdn/allowed-hosts.map;
  }

  # the pypi index pages are rewritten below, which needs an uncompressed
  # upstream response. An empty value drops the header.
  map $upstream_host $upstream_accept_encoding {
    default $http_accept_encoding;
    pypi.org '';
  }

  # recomputed for every redirect hop, map results are cached otherwise
  map $upstream_http_location $redirect_host {
    volatile;
    default '';
    ~^https://(?<location_host>[^/:]+)(:443)?/ $location_host;
  }

  map $redirect_host $redirect_allowed {
    volatile;
    default 0;
    include /etc/containerbase-cdn/allowed-hosts.map;
  }

  server {
    listen 8099;

    # the runner itself and the docker networks of the builds
    allow 127.0.0.1;
    allow 172.16.0.0/12;
    deny all;

    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    # the default depth of 1 rejects chains with an intermediate certificate
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_http_version 1.1;
    # needed to reuse the upstream connections
    proxy_set_header Connection '';
    proxy_set_header Accept-Encoding $upstream_accept_encoding;
    proxy_read_timeout 300s;
    # GitHub's redirects carry long signed urls and large security headers
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;
    proxy_cache cdn;
    # cache by the requested url, also for responses fetched after a redirect,
    # and by the Accept header: npm installs request the abbreviated packument
    # with it, while the CLI's version lookups fetch the full one from the same url
    proxy_cache_key "$request_uri $http_accept";
    # cache downloads for the job, whatever the upstream cache headers say
    proxy_cache_valid 200 1d;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 300s;
    add_header X-Cache-Status $upstream_cache_status always;

    # the pypi index pages link to absolute file urls, so point them at this
    # proxy too. The cache keeps the upstream body, the links are rewritten
    # when serving it. pip requests the json index, the html one is the
    # fallback. Compressed responses of other hosts are left as is.
    sub_filter 'https://files.pythonhosted.org/' '$scheme://$http_host/files.pythonhosted.org/';
    sub_filter_once off;
    sub_filter_types application/vnd.pypi.simple.v1+json application/vnd.pypi.simple.v1+html;

    # follow upstream redirects here, so the client never leaves the proxy
    proxy_intercept_errors on;
    recursive_error_pages on;

    location / {
      set $final_host $upstream_host;
      if ($upstream_allowed = 0) {
        return 403 "host not allowed: $upstream_host\n";
      }
      proxy_pass https://$upstream_host/$upstream_rest;
      error_page 301 302 303 307 308 = @redirect;
    }

    location @redirect {
      set $final_host $redirect_host;
      if ($redirect_allowed = 0) {
        return 403 "redirect not allowed: $upstream_http_location\n";
      }
      set $redirect_location $upstream_http_location;
      proxy_pass $redirect_location;
      error_page 301 302 303 307 308 = @redirect;
    }
  }
}
